00 2rem 'Cormorant Garamond',serif;color:#73552c}.detail-list{display:grid;gap:18px;width:100%;max-width:390px;margin:15px auto}.detail-row{padding:12px;border-bottom:1px solid #d9c69e}.detail-row b{display:block;color:#9a7436;font:600 1.5rem 'Cormorant Garamond',serif}.detail-row span{font-size:1rem}.attire-note{max-width:390px;margin:14px auto 0;padding:11px 14px;border:1px solid #cbaeb5;border-radius:12px;background:#fff8f3;color:var(--plum);font-size:.92rem;line-height:1.5}.attire-note b{display:block;margin-bottom:4px;color:var(--rose);letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}.countdown{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.countdown div{background:var(--rose);color:#fff;padding:10px 9px;min-width:66px;border-radius:9px;border:1px solid #d8b9c0}.countdown strong{display:block;font:600 1.7rem 'Cormorant Garamond',serif}.countdown span{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:12px}.gallery button{border:5px solid #fffdf6;padding:0;background:#fff;box-shadow:0 4px 12px #49351e25;overflow:hidden}.gallery img{width:100%;height:180px;object-fit:cover;transition:transform .3s}.gallery button:hover img{transform:scale(1.06)}.gallery button:first-child{grid-column:span 2}.gallery button:first-child img{height:210px}.rsvp-card{background:var(--plum);color:#fff8e8;border:2px solid #cbaeb5;border-radius:16px;padding:22px;width:100%;max-width:400px;margin:16px auto}.rsvp-card label{display:block;text-align:left;margin:10px 0 5px;font-size:.9rem}.rsvp-card input,.rsvp-card select{width:100%;padding:11px;border:1px solid #d8c28d;border-radius:8px;background:#fffdf6;color:#34422e}.rsvp-card .rsvp-btn{width:100%;margin-top:15px;color:#fff}.page-number{position:absolute;bottom:22px;color:#9d865b;font:italic 1rem 'Cormorant Garamond',serif}.left .page-number{left:35px}.right .page-number{right:35px}.book-controls{width:min(1100px,100%);display:flex;align-items:center;justify-content:center;gap:18px;margin:18px auto 0;color:var(--plum)}.nav-btn{background:var(--plum);border-color:#cbaeb5;padding:10px 20px}.nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.dots{display:flex;gap:8px}.dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--rose);background:transparent;padding:0}.dots button.active{background:var(--rose)}.hint{color:var(--plum);font-size:.8rem;text-align:center;margin:12px}.hidden{display:none!important}

 html{font-size:16px}body{min-height:100svh}#book-app{width:100%;min-height:100svh;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));justify-content:flex-start;gap:0}
 .topbar{width:100%;margin:0 auto 12px;display:grid;grid-template-columns:1fr auto;gap:5px 10px}.topbar .brand{font-size:1.35rem}.chapter{grid-column:1;font-size:.62rem;letter-spacing:.1em;line-height:1.35}.music-btn{grid-column:2;grid-row:1/3;padding:9px 12px;font-size:.82rem}
 .book{display:block;width:100%;min-height:0;filter:none;perspective:none}.book:before{display:none}.page{width:100%;min-height:0;height:auto;max-height:none;overflow:visible;border-radius:12px!important;padding:clamp(25px,7vw,38px) clamp(20px,6vw,30px) 52px}.page.left{display:none}.page.right{display:block}.page:after{inset:8px}.page-inner{height:auto;min-height:440px;justify-content:flex-start;padding:8px 2px 18px}.page h2{font-size:clamp(2.4rem,11vw,3.4rem);margin:8px 0 14px}.page p{font-size:.98rem;line-height:1.6}.page.right .page-number{right:24px;bottom:16px}
 .photo-frame{max-width:94%}.photo-frame img{max-height: min(48vh,370px);object-fit:cover}.photo-frame.tall img{height:min(52vh,390px)}.small-photo{width:min(230px,76%);max-height:230px}.gallery{gap:8px}.gallery img{height:clamp(115px,34vw,165px)}.gallery button:first-child img{height:clamp(140px,42vw,185px)}
 .countdown{gap:6px;width:100%}.countdown div{flex:1 1 20%;min-width:0;padding:9px 5px}.countdown strong{font-size:clamp(1.35rem,6vw,1.7rem)}.countdown span{font-size:.57rem;letter-spacing:.04em}
 .rsvp-card{padding:17px 15px;margin:12px auto}.rsvp-card input,.rsvp-card select{font-size:16px;min-height:44px}.rsvp-btn{padding:12px 14px;font-size:.9rem}
 .book-controls{width:100%;gap:8px;margin:12px auto 0;flex-wrap:wrap}.nav-btn{padding:11px 13px;font-size:.85rem}.dots{gap:7px}.dots button{width:10px;height:10px}.hint{font-size:.75rem;margin:9px 5px 0}
 #cover-screen{padding:12px}.closed-book{width:min(440px,100%);min-height:0;max-height:calc(100svh - 24px);overflow-y:auto;padding:22px 20px 26px}.cover-photo{width:min(230px,65vw);height:clamp(170px,32vh,250px);margin:8px auto 12px}.closed-book h1{font-size:clamp(3.1rem,15vw,4.6rem)}.closed-book .name{font-size:1.4rem;margin:8px auto 16px}.cover-flower{font-size:1.7rem;margin:8px}
 #lightbox{padding:12px}#lightbox img{max-width:96vw;max-height:82svh}

<body>
<div id="cover-screen"><div class="closed-book"><div class="cover-flower">✧ ❀ ✧</div><p class="eyebrow">Había una vez… una noche mágica</p><img class="cover-photo" src="img/maria-y-su-perrita.png" alt="María Del Carmen junto a su perrita"><h1>Mis XV Años</h1><p class="name">María Del Carmen<br>Veizaga Velasquez</p><p class="eyebrow">Una historia que quiero compartir contigo</p><div class="cover-flower">❦</div><button class="open-btn" id="openBook">Abrir mi cuento ✨</button></div></div>
<audio id="music" src="musica.mp3" loop preload="metadata"></audio>
<main id="book-app">
 <div class="topbar"><span class="brand">Mi cuento de XV años</span><span class="chapter" id="chapterName">Capítulo 1 · El comienzo</span><button class="music-btn" id="musicToggle" type="button">♫ Música: activar</button></div>
 <div class="book" aria-live="polite">
  <section class="page left" id="leftPage"><div class="page-inner" id="leftContent"></div><span class="page-number" id="leftNum">1</span></section>
  <section class="page right single" id="rightPage"><div class="page-inner" id="rightContent"></div><span class="page-number" id="rightNum">2</span></section>
 </div>
 <div class="book-controls"><button class="nav-btn" id="prev" type="button">← Anterior</button><div class="dots" id="dots"></div><button class="nav-btn" id="next" type="button">Siguiente →</button></div>
 <p class="hint">Pasa las páginas para descubrir cada capítulo de esta historia ♡</p>
</main>
<div id="lightbox"><button id="closeLightbox" aria-label="Cerrar">×</button><img id="largeImage" alt="Fotografía ampliada"></div>
<script>
const WHATSAPP='59173647756';
const EVENT_DATE=new Date('2026-12-05T20:00:00-04:00').getTime();
const pages=[
 {chapter:'Capítulo 1 · El comienzo',left:`<p class="eyebrow">Una noche · Un sueño · Un recuerdo</p><h2>Había una vez…</h2><p>Una joven soñadora que está por comenzar uno de los capítulos más hermosos de su vida.</p><div class="ornament">❦ ✧ ❦</div><img class="small-photo" src="img/corona.jpg" alt="María con su corona"><p class="serif"><i>Y ese cuento… es el mío.</i></p>`,right:`<p class="eyebrow">Con mucha ilusión te invito</p><h2>Mis XV Años</h2><div class="photo-frame"><img src="img/maria-y-su-perrita.png" alt="María Del Carmen con su perrita vestida de ranita"></div><h3>María Del Carmen<br>Veizaga Velasquez</h3><div class="gold-rule"></div><p>Quiero que seas parte de esta noche mágica, llena de alegría, cariño y nuevos sueños.</p>`},
 {chapter:'Capítulo 2 · Un sueño hecho realidad',left:`<p class="eyebrow">Mi historia</p><h2>Quince años, mil sueños</h2><div class="photo-frame tall"><img src="img/arriba.jpg" alt="María Del Carmen con su vestido verde"></div>`,right:`<div class="ornament">✧ ❀ ✧</div><h2>Un capítulo especial</h2><p>En este cuento de mi vida, Dios ha escrito los mejores capítulos y hoy celebro mis XV años.</p><p>He llegado a una etapa llena de ilusiones, aprendizajes y nuevas aventuras. Me encantaría compartir este momento con las personas que quiero.</p><p><i>Tu presencia hará que esta historia sea aún más inolvidable.</i></p><div class="ornament">♡</div>`},
 {chapter:'Capítulo 3 · La gran celebración',left:`<p class="eyebrow">Guarda esta fecha</p><h2>La cita es contigo</h2><p class="date-large">Sábado<br>5 de diciembre de 2026</p><div class="gold-rule"></div><p>La magia comenzará a las</p><h3>20:00 horas</h3><div class="ornament">❦</div><p>En <b>Eventos Jiseel</b></p><p><a href="https://www.google.com/maps/search/?api=1&query=-20.449556,-63.520028" target="_blank" rel="noopener">Ver ubicación en Google Maps ↗</a></p>`,right:`<p class="eyebrow">La cuenta regresiva</p><h2>¡Cada vez falta menos!</h2><p>Estoy contando los días para vivir esta noche contigo.</p><div class="countdown" id="countdown"><div><strong id="days">00</strong><span>Días</span></div><div><strong id="hours">00</strong><span>Horas</span></div><div><strong id="minutes">00</strong><span>Minutos</span></div><div><strong id="seconds">00</strong><span>Segundos</span></div></div><div class="ornament">✧ ♡ ✧</div><img class="small-photo" src="img/globo.jpg" alt="María junto al globo dorado de quince"><p><i>¡No faltes!</i></p><div class="attire-note"><b>Un detalle especial</b>Pedimos a nuestros invitados reservar los colores verde y dorado para la quinceañera. ¡Muchas gracias por respetar estos colores tan especiales!</div>`},
 {chapter:'Capítulo 4 · Recuerdos de mi cuento',left:`<p class="eyebrow">Momentos para recordar</p><h2>Mi galería</h2><p>Cada fotografía guarda un pedacito de esta aventura.</p><div class="gallery"><button data-img="img/pastel.jpg"><img src="img/pastel.jpg" alt="María con su pastel"></button><button data-img="img/globo.jpg"><img src="img/globo.jpg" alt="María con el globo quince"></button><button data-img="img/arriba.jpg"><img src="img/arriba.jpg" alt="María con su vestido verde"></button></div>`,right:`<p class="eyebrow">Y también hay personajes especiales…</p><h2>Mi compañera de aventuras</h2><div class="photo-frame"><img src="img/maria-y-su-perrita.png" alt="María y su perrita con disfraz verde"></div><p>Porque los momentos felices son aún más bonitos cuando los compartimos con quienes queremos.</p><div class="gallery"><button data-img="img/corona.jpg"><img src="img/corona.jpg" alt="María con su corona"></button><button data-img="img/reflector.jpg"><img src="img/reflector.jpg" alt="María en su sesión de fotos"></button></div>`},
 {chapter:'Capítulo 5 · Y vivieron una noche inolvidable',left:`<p class="eyebrow">El mejor regalo</p><h2>Tu compañía</h2><div class="ornament">♡ ❦ ♡</div><p>Tu presencia será el mejor regalo y hará que este recuerdo sea inolvidable.</p><p>Me encantaría contar contigo en esta noche tan especial.</p><h3>¿Me acompañas?</h3><div class="ornament">✧</div><p>Por favor, confirma tu asistencia.</p>`,right:`<p class="eyebrow">Última página… por ahora</p><h2>Confirma tu asistencia</h2><p>Déjame saber si podrás acompañarme a celebrar mis XV años.</p><form class="rsvp-card" id="rsvp"><label for="guestName">Tu nombre completo</label><input id="guestName" required placeholder="Escribe tu nombre"><label for="attendance">¿Podrás acompañarme?</label><select id="attendance"><option value="si">Sí, ahí estaré</option><option value="no">No podré asistir</option></select><div id="countWrap"><label for="guestCount">¿Cuántas personas asistirán?</label><select id="guestCount"><option value="1">1 persona</option><option value="2">2 personas</option><option value="3">3 personas</option><option value="4">4 personas</option><option value="5">5 personas</option></select></div><button class="rsvp-btn" type="submit">Confirmar por WhatsApp</button></form><p class="eyebrow">Con cariño, María Del Carmen</p>`}
];
let current=0;const $=id=>document.getElementById(id);
function render(){const p=pages[current];$('leftContent').innerHTML=p.left;$('rightContent').innerHTML=p.right;$('chapterName').textContent=p.chapter;$('leftNum').textContent=String(current*2+1);$('rightNum').textContent=String(current*2+2);$('prev').disabled=current===0;$('next').disabled=current===pages.length-1;$('dots').innerHTML=pages.map((_,i)=>`<button type="button" aria-label="Ir al capítulo ${i+1}" class="${i===current?'active':''}" data-page="${i}"></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.page;render()}));document.querySelectorAll('.gallery button').forEach(b=>b.addEventListener('click',()=>{ $('largeImage').src=b.dataset.img;$('lightbox').classList.add('show')}));if($('rsvp')) setupRsvp();countdown();window.scrollTo({top:0,behavior:'smooth'});}
$('prev').addEventListener('click',()=>{if(current>0){current--;render()}});$('next').addEventListener('click',()=>{if(current<pages.length-1){current++;render()}});
$('openBook').addEventListener('click',async()=>{$('cover-screen').classList.add('hide');$('book-app').classList.add('ready');try{$('music').volume=.45;await $('music').play();$('musicToggle').textContent='Ⅱ Música: pausa'}catch(e){$('musicToggle').textContent='♫ Música: activar'}});
$('musicToggle').addEventListener('click',async()=>{const a=$('music');if(a.paused){try{await a.play();$('musicToggle').textContent='Ⅱ Música: pausa'}catch(e){}}else{a.pause();$('musicToggle').textContent='♫ Música: activar'}});
$('closeLightbox').addEventListener('click',()=>$('lightbox').classList.remove('show'));$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('show')});
function countdown(){const box=$('countdown');if(!box)return;const days=$('days'),hours=$('hours'),minutes=$('minutes'),seconds=$('seconds');if(!days||!hours||!minutes||!seconds)return;const remaining=EVENT_DATE-Date.now();if(remaining<=0){box.innerHTML='<h3>¡Hoy celebramos!</h3>';return}const totalSeconds=Math.floor(remaining/1000);days.textContent=String(Math.floor(totalSeconds/86400));hours.textContent=String(Math.floor(totalSeconds%86400/3600)).padStart(2,'0');minutes.textContent=String(Math.floor(totalSeconds%3600/60)).padStart(2,'0');seconds.textContent=String(totalSeconds%60).padStart(2,'0')}
function setupRsvp(){const attendance=$('attendance');attendance.addEventListener('change',()=>{$('countWrap').classList.toggle('hidden',attendance.value!=='si')});$('rsvp').addEventListener('submit',e=>{e.preventDefault();const name=$('guestName').value.trim();if(!name){$('guestName').focus();return}let msg=attendance.value==='si'?`Hola, soy ${name}. Confirmo mi asistencia a los XV años de María Del Carmen el 5 de diciembre de 2026. Asistiremos ${$('guestCount').value} persona(s).`:`Hola, soy ${name}. Lamentablemente no podré asistir a los XV años de María Del Carmen. ¡Le deseo una linda fiesta!`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank','noopener')})}
render();countdown();setInterval(countdown,1000);
</script></body></html>
